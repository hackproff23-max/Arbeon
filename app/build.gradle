plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arbeon.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.arbeon.browser"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        arbeon {
            storeFile file('arbeon.jks')
            storePassword 'arbeon123'
            keyAlias 'arbeon'
            keyPassword 'arbeon123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.arbeon
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.arbeon
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
